plugins {
    id 'com.android.application'
}
android {
    namespace 'com.memora.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.memora.mobile'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
