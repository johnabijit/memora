name: Build Memora Android APK
on:
  push:
    branches: [build/android-apk-20261021]
  workflow_dispatch:
  pull_request:
    branches: [cloudflare-v43-fixes]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: android-apk
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Memora-Android-v43.3-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
