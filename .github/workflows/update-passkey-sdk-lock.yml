name: Resolve experimental Supabase passkey SDK

on:
  push:
    branches: [auth-passkeys]
    paths:
      - 'package.json'
      - '.github/workflows/update-passkey-sdk-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-passkeys
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve new auth library and update lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts --no-audit
          npm test
          npm run build
      - name: Commit tested dependency lockfile
        run: |
          git config user.name "memora-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Resolve tested Supabase passkey SDK dependencies"
            git push origin HEAD:auth-passkeys
          fi
