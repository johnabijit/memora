name: Generate Memora app icons
on:
  push:
    branches: [memora-navigation-player-v2]
    paths:
      - icon.svg
      - .github/workflows/memora-icon-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memora-navigation-player-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render branded icon PNG assets
        run: |
          python -m pip install cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          import io
          for size,name in [(192,'icon-192.png'),(512,'icon-512.png'),(512,'icon-maskable-512.png'),(180,'apple-touch-icon.png')]:
              result=cairosvg.svg2png(url='icon.svg',output_width=size,output_height=size)
              image=Image.open(io.BytesIO(result)).convert('RGBA')
              image.save(name,optimize=True)
              print(name,image.size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "memora-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Memora icons for Android, iOS and PWA"
            git push origin HEAD:memora-navigation-player-v2
          fi
