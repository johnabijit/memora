name: Test Memora Visual Redesign
on:
  push:
    branches: [ux-universal-player-brand-themes]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
      - run: npm run build
      - run: test -s dist/index.html
