name: Build Memora Android APK
on:
  push:
    branches: [android-v17-pull-to-refresh, mobile-installers]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/memora-android-apk.yml'
  pull_request:
    branches: [mobile-installers]
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Memora-Android-v1.7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Memora-Android-v1.7-APK
          path: mobile/android/app/build/outputs/apk/debug/Memora-Android-v1.7.apk
          retention-days: 30
