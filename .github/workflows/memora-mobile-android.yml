name: Build Memora Android APK

on:
  push:
    branches: [mobile-installers]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/memora-mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include the Android SDK and sdkmanager.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "No Android sdkmanager found"; exit 1; fi
          echo "Android SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Show APK metadata
        run: |
          ls -lh mobile/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Memora-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
