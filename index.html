<head>

  <meta name="theme-color" content="#090c12">
  <meta name="description" content="Ormemora, your private visual memory and life timeline">
  <meta name="memora-build" content="2026.10.27.45.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Ormemora | Your life, remembered beautifully</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script>
    // The Android app signs in through the system browser and keeps its PKCE
    // verifier in the embedded WebView. Google returns to this existing,
    // allowlisted HTTPS URL, where we hand the one-time code back to the app.
    // Regular browser logins and the Ormemora WebView skip this screen.
    (() => {
      const code = new URL(location.href).searchParams.get('code');
      const nativeWebView = /\bMemoraAndroid\/\d+\b/.test(navigator.userAgent);
      const androidBrowser = /Android/i.test(navigator.userAgent) && !nativeWebView;
      const isMobileReturn = androidBrowser && typeof code === 'string'
        && /^[A-Za-z0-9_-]{8,2048}$/.test(code);
      window.memoraMobileOAuthReturn = isMobileReturn;
      if (!isMobileReturn) return;

      const appUrl = 'memora://auth/callback?code=' + encodeURIComponent(code);
      document.addEventListener('DOMContentLoaded', () => {
        document.title = 'Return to Ormemora';
        document.body.style.cssText = 'margin:0;background:#0c1019;color:white;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif';
        document.body.replaceChildren();
        const panel = document.createElement('main');
        panel.style.cssText = 'max-width:360px;margin:24px;text-align:center;padding:32px;border:1px solid #363b48;border-radius:22px;background:#171c27';
        const logo = document.createElement('div');
        logo.innerHTML = '<img src="/icon.svg" alt="Ormemora" width="72" height="72" style="display:block;width:100%;height:100%;object-fit:contain" />';
        logo.style.cssText = 'margin:0 auto 20px;width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#09c9cc,#7f64f6);display:grid;place-items:center;font-size:36px;font-weight:bold';
        const title = document.createElement('h1');
        title.textContent = 'Continue in Ormemora';
        title.style.cssText = 'margin:0 0 12px;font-size:24px';
        const note = document.createElement('p');
        note.textContent = 'Google sign-in is complete. Tap the button to return securely to the Ormemora app.';
        note.style.cssText = 'color:#d0d3da;line-height:1.6;margin-bottom:22px';
        const link = document.createElement('a');
        link.href = appUrl;
        link.textContent = 'Open Ormemora';
        link.style.cssText = 'display:block;padding:16px;color:#16181b;background:#dfb92e;border-radius:14px;font-weight:700;text-decoration:none';
        panel.append(logo,title,note,link);
        document.body.append(panel);
        // Some Android browsers block automatic custom-scheme launches. Keep
        // the user-activated link visible instead of leaving a blank page.
        window.setTimeout(() => { if (document.visibilityState === 'visible') location.assign(appUrl); }, 350);
      }, { once:true });
    })();
  </script>

  <link rel="stylesheet" href="styles.css?v=45.0">
  <!-- memora-release-v43.1 -->
</head>
<body>
  <script>
    (() => {
      const scrub = () => {
        if (!document.body) return;
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        const remove = [];
        while (walker.nextNode()) {
          const node = walker.currentNode;
          const parent = node.parentElement;
          if (!parent || parent.closest('textarea,input,pre,code,[contenteditable="true"]')) continue;
          const text = String(node.textContent || '').trim();
          if (/^(?:\\n|\/n)+$/i.test(text)) remove.push(node);
        }
        remove.forEach(node => node.remove());
      };
      new MutationObserver(scrub).observe(document.body, { childList: true, subtree: true });
      requestAnimationFrame(scrub);
    })();
  </script>
  <div id="app"><div class="auth-wrap"><div class="glass auth-card auth-loading" role="status"><div class="brand"><div class="logo brand-symbol"><img src="/icon.svg" alt="" width="42" height="42"></div><h1>Ormemora</h1></div><p>Opening your private universe...</p><div class="auth-loader"><span></span><span></span><span></span></div></div></div></div>
  <script>
    window.memoraReady = false;
    window.memoraStartupFailed = () => {
      if (window.memoraReady) return;
      document.getElementById('app').innerHTML = '<div class="auth-wrap"><div class="glass auth-card"><div class="brand"><div class="logo brand-symbol"><img src="/icon.svg" alt="" width="42" height="42"></div><h1>Ormemora</h1></div><h2>Let’s try again</h2><p>Ormemora could not finish loading. Check your connection and retry.</p><button class="btn primary" id="retryStartup">Retry</button></div></div>';
      document.getElementById('retryStartup').onclick = () => location.reload();
    };
    window.addEventListener('error', event => {
      if (event.target && event.target.tagName === 'SCRIPT') window.memoraStartupFailed();
    }, true);
    window.addEventListener('unhandledrejection', () => window.memoraStartupFailed());
  </script>
  <script type="module">
    if (!window.memoraMobileOAuthReturn) await import('./app.js?v=45.0');
  </script>
</body>
</html>
